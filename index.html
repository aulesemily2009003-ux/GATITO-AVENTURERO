<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TURBO CAR</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#08000f;
  color:white;
}

button,input{
  font-family:inherit;
}

button{
  touch-action:none;
}

#menu{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 15% 20%,#ff008c55,transparent 30%),
    radial-gradient(circle at 85% 20%,#7000ff55,transparent 30%),
    radial-gradient(circle at 50% 90%,#00d9ff44,transparent 35%),
    #08000f;
  z-index:100;
}

.panel{
  width:min(500px,100%);
  padding:30px;
  border-radius:30px;
  text-align:center;
  background:linear-gradient(145deg,#ff008c38,#7200ff42);
  border:2px solid #ff39d4;
  box-shadow:
    0 0 25px #ff00bbaa,
    0 0 80px #7200ff66,
    inset 0 0 30px #ff00aa22;
  backdrop-filter:blur(14px);
}

.logo{
  margin:0;
  font-size:clamp(48px,12vw,78px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:-5px;
  text-shadow:
    0 0 10px #ff00cc,
    0 0 30px #ff008c,
    0 0 60px #7200ff;
}

.subtitle{
  color:#ff9ee9;
  font-weight:bold;
  letter-spacing:3px;
  margin:8px 0 25px;
}

input{
  width:100%;
  padding:16px;
  margin:7px 0;
  border-radius:15px;
  border:2px solid #ff37d4;
  background:#13001e;
  color:#fff;
  outline:none;
  text-align:center;
  font-size:18px;
}

input:focus{
  border-color:#00eaff;
  box-shadow:0 0 18px #00eaff88;
}

.buttons{
  display:grid;
  gap:12px;
  margin-top:12px;
}

.btn{
  border:0;
  border-radius:16px;
  padding:17px;
  color:#fff;
  font-weight:1000;
  font-size:16px;
  background:linear-gradient(135deg,#ff008c,#8b00ff);
  box-shadow:0 5px 0 #4b006b,0 0 22px #ff00bb88;
}

.btn.blue{
  background:linear-gradient(135deg,#00eaff,#0066ff);
  box-shadow:0 5px 0 #00337a,0 0 22px #00d9ff88;
}

.btn:active{
  transform:translateY(4px);
}

#lobby{
  display:none;
}

.roomCode{
  margin:20px 0;
  padding:15px;
  border-radius:18px;
  border:2px solid #00eaff;
  background:#05000c;
  color:#52f7ff;
  font-size:38px;
  font-weight:1000;
  letter-spacing:8px;
  text-shadow:0 0 20px #00eaff;
}

.players{
  display:grid;
  gap:8px;
  margin:15px 0 20px;
}

.player{
  padding:12px;
  border-radius:14px;
  background:#ffffff10;
  border:1px solid #ffffff2e;
  font-weight:bold;
}

#game{
  position:fixed;
  inset:0;
  display:none;
  background:#100018;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  z-index:10;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:7px;
  padding:7px;
  border-radius:17px;
  background:linear-gradient(90deg,#ff008c,#7200ff,#00d9ff);
  box-shadow:0 0 25px #ff00bb99;
  white-space:nowrap;
}

.badge{
  padding:7px 10px;
  border-radius:10px;
  background:#08000dcc;
  font-size:13px;
  font-weight:900;
}

#countdown{
  position:absolute;
  z-index:20;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  font-size:clamp(60px,15vw,130px);
  font-weight:1000;
  font-style:italic;
  text-shadow:
    0 0 15px #ff00c8,
    0 0 40px #7200ff,
    0 0 80px #00eaff;
  pointer-events:none;
}

#mobileControls{
  position:absolute;
  z-index:30;
  left:0;
  right:0;
  bottom:18px;
  display:none;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.controlSide{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.control{
  width:68px;
  height:68px;
  border-radius:50%;
  border:2px solid #ff61df;
  background:
    radial-gradient(circle at 35% 25%,#ff83e8,#ff008c 55%,#7200ff);
  color:white;
  font-size:27px;
  font-weight:1000;
  box-shadow:
    0 0 15px #ff00bb,
    inset 0 0 15px #ffffff33;
}

.control.turbo{
  border-color:#58f7ff;
  background:
    radial-gradient(circle at 35% 25%,#baffff,#00d9ff 55%,#0066ff);
  box-shadow:0 0 20px #00eaff;
}

.control:active{
  transform:scale(.88);
}

#finish{
  position:fixed;
  inset:0;
  z-index:90;
  display:none;
  align-items:center;
  justify-content:center;
  background:#08000fd9;
  backdrop-filter:blur(12px);
}

.finishPanel{
  width:min(450px,90%);
  text-align:center;
  padding:30px;
  border-radius:30px;
  border:2px solid #ff39d4;
  background:linear-gradient(145deg,#ff008c55,#7200ff66);
  box-shadow:0 0 60px #ff00bb;
}

.rank{
  font-size:90px;
  font-weight:1000;
  text-shadow:0 0 35px #ff00cc;
}

@media(max-width:700px){

  #mobileControls{
    display:flex;
  }

  .panel{
    padding:22px;
  }

  #hud{
    font-size:11px;
  }

  .badge{
    padding:6px;
  }

  .control{
    width:62px;
    height:62px;
  }
}
</style>
</head>

<body>

<div id="menu">

  <div class="panel" id="mainPanel">

    <div class="logo">
      TURBO CAR
    </div>

    <div class="subtitle">
      NEON STREET RACING
    </div>

    <input
      id="name"
      maxlength="14"
      placeholder="Escribe tu nombre">

    <div class="buttons">

      <button class="btn" onclick="createRoom()">
        🏁 CREAR SALA
      </button>

      <button class="btn blue" onclick="showJoin()">
        🔑 UNIRSE A SALA
      </button>

    </div>

  </div>

  <div class="panel" id="lobby">

    <div class="logo" style="font-size:48px">
      TURBO CAR
    </div>

    <p>Comparte este código:</p>

    <div class="roomCode" id="roomCode">
      ----
    </div>

    <div class="players" id="players"></div>

    <button
      id="startButton"
      class="btn"
      onclick="startRace()">
      🚦 INICIAR CARRERA
    </button>

    <button
      class="btn blue"
      onclick="location.reload()"
      style="margin-top:10px">
      SALIR
    </button>

  </div>

</div>


<div id="game">

  <canvas id="canvas"></canvas>

  <div id="hud">

    <div class="badge">
      🏁 <span id="lap">1/3</span>
    </div>

    <div class="badge">
      🏆 <span id="position">1°</span>
    </div>

    <div class="badge">
      ⚡ <span id="speed">0</span>
    </div>

    <div class="badge">
      👥 <span id="online">1</span>/4
    </div>

  </div>

  <div id="countdown"></div>

  <!-- CONTROLES PARA CELULAR -->

  <div id="mobileControls">

    <div class="controlSide">

      <button class="control" id="left">
        ◀
      </button>

      <button class="control" id="right">
        ▶
      </button>

    </div>

    <div class="controlSide">

      <button class="control" id="down">
        ▼
      </button>

      <button class="control" id="up">
        ▲
      </button>

      <button class="control turbo" id="turbo">
        ⚡
      </button>

    </div>

  </div>

</div>


<div id="finish">

  <div class="finishPanel">

    <h1>🏆 TURBO CAR</h1>

    <div class="rank" id="finalRank">
      1°
    </div>

    <h2 id="finalText"></h2>

    <button
      class="btn"
      onclick="location.reload()">
      🔄 JUGAR DE NUEVO
    </button>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const MAX_PLAYERS=4;
const LAPS=3;

let peer=null;
let host=false;
let roomCode="";
let myId="";
let myName="";

let connections={};
let players={};

let gameStarted=false;

const colors=[
  "#ff1493",
  "#8b2cff",
  "#00d9ff",
  "#39ff14"
];


/* =========================================================
   CANVAS
========================================================= */

const canvas=
  document.getElementById("canvas");

const ctx=
  canvas.getContext("2d");

let VW=innerWidth;
let VH=innerHeight;

function resize(){

  const dpr=
    Math.min(
      devicePixelRatio||1,
      2
    );

  canvas.width=
    innerWidth*dpr;

  canvas.height=
    innerHeight*dpr;

  canvas.style.width=
    innerWidth+"px";

  canvas.style.height=
    innerHeight+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  VW=innerWidth;
  VH=innerHeight;
}

addEventListener("resize",resize);

resize();


/* =========================================================
   PISTA LARGA
========================================================= */

const track=[];
const TRACK_POINTS=1000;

for(let i=0;i<TRACK_POINTS;i++){

  const t=
    i/TRACK_POINTS*Math.PI*2;

  const radiusX=
    1550+
    Math.sin(t*5)*230+
    Math.cos(t*9)*100;

  const radiusY=
    900+
    Math.cos(t*4)*180+
    Math.sin(t*7)*80;

  track.push({

    x:Math.cos(t)*radiusX,

    y:Math.sin(t)*radiusY

  });

}


/* =========================================================
   AUTO
========================================================= */

function newCar(index,name){

  const p=track[0];

  return {

    id:index,

    name:name||"Jugador",

    x:p.x,

    y:p.y,

    angle:
      Math.atan2(
        track[1].y-p.y,
        track[1].x-p.x
      ),

    speed:0,

    progress:0,

    lap:0,

    finished:false,

    color:
      colors[index%colors.length],

    turbo:100,

    input:{},

    steeringAngle:0

  };

}


/* =========================================================
   MENÚ
========================================================= */

function getName(){

  const n=
    document.getElementById("name")
      ?.value.trim();

  return n||"Jugador";

}


function showJoin(){

  document.getElementById("mainPanel")
    .innerHTML=`

      <div class="logo"
           style="font-size:52px">
        TURBO CAR
      </div>

      <div class="subtitle">
        UNIRSE A CARRERA
      </div>

      <input
        id="joinName"
        maxlength="14"
        placeholder="Tu nombre">

      <input
        id="joinCode"
        maxlength="4"
        inputmode="numeric"
        placeholder="Código de 4 números">

      <div class="buttons">

        <button
          class="btn blue"
          onclick="joinRoom()">
          🏎️ ENTRAR
        </button>

        <button
          class="btn"
          onclick="location.reload()">
          VOLVER
        </button>

      </div>
  `;

}


/* =========================================================
   CREAR SALA
========================================================= */

function createRoom(){

  myName=getName();

  host=true;

  roomCode=
    String(
      Math.floor(
        1000+
        Math.random()*9000
      )
    );

  const peerId=
    "turbo-car-room-"+roomCode;

  peer=new Peer(peerId);

  peer.on("open",id=>{

    myId=id;

    players={};

    players[myId]=
      newCar(0,myName);

    showLobby();

  });


  peer.on("connection",conn=>{

    if(
      Object.keys(players).length>=MAX_PLAYERS
    ){

      conn.on("open",()=>{

        conn.send({
          type:"FULL"
        });

        conn.close();

      });

      return;
    }


    connections[conn.peer]=conn;


    conn.on("data",data=>{

      if(data.type==="JOIN"){

        if(
          Object.keys(players).length>=MAX_PLAYERS
        ){

          conn.send({
            type:"FULL"
          });

          return;
        }

        const index=
          Object.keys(players).length;

        players[conn.peer]=
          newCar(
            index,
            data.name
          );

        broadcastLobby();

      }


      if(data.type==="INPUT"){

        if(players[conn.peer]){

          players[conn.peer].input=
            data.input;

        }

      }

    });


    conn.on("close",()=>{

      delete players[conn.peer];

      delete connections[conn.peer];

      broadcastLobby();

    });

  });


  peer.on("error",err=>{

    console.error(err);

    if(err.type==="unavailable-id"){

      alert(
        "Ese código ya está ocupado. Crea otra sala."
      );

    }else{

      alert(
        "No se pudo crear la sala."
      );

    }

  });

}


/* =========================================================
   UNIRSE
========================================================= */

function joinRoom(){

  myName=
    document.getElementById("joinName")
      .value.trim()||
    "Jugador";

  roomCode=
    document.getElementById("joinCode")
      .value.trim();

  if(!/^\d{4}$/.test(roomCode)){

    alert(
      "Escribe un código de 4 números."
    );

    return;
  }


  peer=new Peer();


  peer.on("open",id=>{

    myId=id;

    const hostId=
      "turbo-car-room-"+roomCode;

    const conn=
      peer.connect(
        hostId,
        {
          reliable:true
        }
      );

    connections.host=conn;


    conn.on("open",()=>{

      conn.send({

        type:"JOIN",

        name:myName

      });

    });


    conn.on("data",data=>{

      if(data.type==="LOBBY"){

        players=data.players;

        showLobby();

      }


      if(data.type==="START"){

        players=data.players;

        beginGame();

      }


      if(data.type==="STATE"){

        players=data.players;

      }


      if(data.type==="FULL"){

        alert(
          "La sala ya tiene 4 jugadores."
        );

        location.reload();

      }

    });


    conn.on("close",()=>{

      alert(
        "El anfitrión salió de la partida."
      );

      location.reload();

    });

  });


  peer.on("error",()=>{

    alert(
      "No se encontró la sala. Comprueba el código."
    );

  });

}


/* =========================================================
   LOBBY
========================================================= */

function showLobby(){

  document.getElementById("mainPanel")
    .style.display="none";

  document.getElementById("lobby")
    .style.display="block";

  document.getElementById("roomCode")
    .textContent=roomCode;

  updateLobby();

}


function updateLobby(){

  const box=
    document.getElementById("players");

  box.innerHTML="";

  Object.values(players)
    .forEach((p,index)=>{

      const div=
        document.createElement("div");

      div.className="player";

      div.textContent=
        `${index===0?"👑":"🏎️"} ${p.name}`;

      box.appendChild(div);

    });


  document.getElementById("startButton")
    .style.display=
      host?"block":"none";

}


function broadcastLobby(){

  updateLobby();

  Object.values(connections)
    .forEach(conn=>{

      if(conn&&conn.open){

        conn.send({

          type:"LOBBY",

          players:players

        });

      }

    });

}


/* =========================================================
   CARRERA
========================================================= */

function startRace(){

  if(!host)return;

  broadcastAll({

    type:"START",

    players:players

  });

  beginGame();

}


function beginGame(){

  document.getElementById("menu")
    .style.display="none";

  document.getElementById("game")
    .style.display="block";

  gameStarted=true;

  showCountdown();

  requestAnimationFrame(loop);

}


function showCountdown(){

  const el=
    document.getElementById("countdown");

  let n=3;

  el.textContent=n;

  const timer=
    setInterval(()=>{

      n--;

      if(n>0){

        el.textContent=n;

      }else{

        clearInterval(timer);

        el.textContent="¡GO!";

        setTimeout(()=>{

          el.textContent="";

        },700);

      }

    },850);

}


/* =========================================================
   TECLADO
========================================================= */

const keys={};

addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()]=true;

  if(
    e.key.startsWith("Arrow")||
    e.key===" "
  ){

    e.preventDefault();

  }

});


addEventListener("keyup",e=>{

  keys[e.key.toLowerCase()]=false;

});


/* =========================================================
   CONTROLES CELULAR
========================================================= */

function bindButton(id,key){

  const button=
    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      keys[key]=true;

    }
  );

  const release=()=>{

    keys[key]=false;

  };

  button.addEventListener(
    "pointerup",
    release
  );

  button.addEventListener(
    "pointercancel",
    release
  );

  button.addEventListener(
    "pointerleave",
    release
  );

}


bindButton("left","arrowleft");
bindButton("right","arrowright");
bindButton("up","arrowup");
bindButton("down","arrowdown");
bindButton("turbo"," ");


/* =========================================================
   INPUT
========================================================= */

function getInput(){

  return {

    left:
      !!(
        keys["arrowleft"]||
        keys["a"]
      ),

    right:
      !!(
        keys["arrowright"]||
        keys["d"]
      ),

    up:
      !!(
        keys["arrowup"]||
        keys["w"]
      ),

    down:
      !!(
        keys["arrowdown"]||
        keys["s"]
      ),

    turbo:
      !!keys[" "]

  };

}


/* =========================================================
   FÍSICA
========================================================= */

function updateCar(car,input){

  if(!input)
    input={};


  if(input.up){

    car.speed+=
      input.turbo
      ?0.16
      :0.085;

  }else{

    car.speed*=0.982;

  }


  if(input.down){

    if(car.speed>0){

      car.speed*=0.91;

    }else{

      car.speed-=0.055;

    }

  }


  const maxSpeed=
    input.turbo
    ?13
    :8.5;

  car.speed=
    Math.max(
      -3,
      Math.min(
        maxSpeed,
        car.speed
      )
    );


  let targetSteering=0;

  if(input.left){

    targetSteering=-1;

  }

  if(input.right){

    targetSteering=1;

  }


  car.steeringAngle +=
    (
      targetSteering-
      car.steeringAngle
    )*0.10;


  if(Math.abs(car.speed)>0.12){

    const speedFactor=
      Math.min(
        1.30,
        0.55+
        Math.abs(car.speed)/8
      );


    car.angle+=
      car.steeringAngle*
      0.045*
      speedFactor;

  }


  if(input.turbo&&input.up){

    car.turbo=
      Math.max(
        0,
        car.turbo-0.9
      );

  }else{

    car.turbo=
      Math.min(
        100,
        car.turbo+0.12
      );

  }


  car.x+=
    Math.cos(car.angle)*
    car.speed;

  car.y+=
    Math.sin(car.angle)*
    car.speed;


  updateProgress(car);

}


/* =========================================================
   PROGRESO
========================================================= */

function updateProgress(car){

  let nearest=0;

  let nearestDist=Infinity;

  for(
    let i=0;
    i<track.length;
    i++
  ){

    const dx=
      car.x-track[i].x;

    const dy=
      car.y-track[i].y;

    const d=
      dx*dx+dy*dy;

    if(d<nearestDist){

      nearestDist=d;

      nearest=i;

    }

  }


  const progress=
    nearest/TRACK_POINTS;


  if(
    car.progress>0.88&&
    progress<0.12&&
    car.speed>1
  ){

    car.lap++;

    if(car.lap>=LAPS){

      car.finished=true;

    }

  }

  car.progress=progress;

}


/* =========================================================
   LOOP
========================================================= */

function loop(){

  if(!gameStarted)
    return;

  const me=
    players[myId];


  if(host){

    Object.values(players)
      .forEach(car=>{

        const input=
          car.id===me?.id
          ?getInput()
          :car.input;

        updateCar(
          car,
          input
        );

      });

    sendState();

  }else{

    if(me){

      const input=
        getInput();

      updateCar(
        me,
        input
      );

      sendInput(input);

    }

  }


  render();

  requestAnimationFrame(loop);

}


/* =========================================================
   COMUNICACIÓN
========================================================= */

let lastInput=0;

function sendInput(input){

  const now=
    performance.now();

  if(now-lastInput<25)
    return;

  lastInput=now;

  const conn=
    connections.host;

  if(conn&&conn.open){

    conn.send({

      type:"INPUT",

      input:input

    });

  }

}


let lastState=0;

function sendState(){

  const now=
    performance.now();

  if(now-lastState<35)
    return;

  lastState=now;

  broadcastAll({

    type:"STATE",

    players:players

  });

}


function broadcastAll(data){

  Object.values(connections)
    .forEach(conn=>{

      if(conn&&conn.open){

        conn.send(data);

      }

    });

}


/* =========================================================
   CÁMARA
========================================================= */

function getCamera(){

  const me=
    players[myId];

  if(!me){

    return {
      x:0,
      y:0
    };

  }

  return {

    x:me.x,

    y:me.y

  };

}


/* =========================================================
   FONDO
========================================================= */

function drawBackground(cam){

  ctx.fillStyle="#090012";

  ctx.fillRect(
    0,
    0,
    VW,
    VH
  );


  const grid=100;

  const startX=
    -((cam.x%grid)+grid)%grid;

  const startY=
    -((cam.y%grid)+grid)%grid;


  ctx.strokeStyle="#ff008c16";

  ctx.lineWidth=1;

  for(
    let x=startX;
    x<VW;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);

    ctx.lineTo(x,VH);

    ctx.stroke();

  }


  ctx.strokeStyle="#00eaff12";

  for(
    let y=startY;
    y<VH;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(VW,y);

    ctx.stroke();

  }

}


/* =========================================================
   PISTA
========================================================= */

function makeTrackPath(){

  ctx.beginPath();

  for(
    let i=0;
    i<track.length;
    i++
  ){

    const p=track[i];

    if(i===0){

      ctx.moveTo(
        p.x,
        p.y
      );

    }else{

      ctx.lineTo(
        p.x,
        p.y
      );

    }

  }

  ctx.closePath();

}


function drawTrack(cam){

  ctx.save();

  ctx.translate(
    VW/2-cam.x,
    VH/2-cam.y
  );


  makeTrackPath();

  ctx.lineWidth=180;

  ctx.strokeStyle="#ff008c";

  ctx.shadowColor="#ff008c";

  ctx.shadowBlur=45;

  ctx.stroke();


  makeTrackPath();

  ctx.lineWidth=160;

  ctx.strokeStyle="#7200ff";

  ctx.shadowBlur=0;

  ctx.stroke();


  makeTrackPath();

  ctx.lineWidth=145;

  ctx.strokeStyle="#24243a";

  ctx.stroke();


  makeTrackPath();

  ctx.lineWidth=4;

  ctx.strokeStyle="#00eaff";

  ctx.stroke();


  makeTrackPath();

  ctx.lineWidth=3;

  ctx.strokeStyle="#ffe83b";

  ctx.setLineDash([
    25,
    22
  ]);

  ctx.stroke();

  ctx.setLineDash([]);


  const p=track[0];

  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );

  ctx.rotate(
    Math.atan2(
      track[1].y-p.y,
      track[1].x-p.x
    )
  );


  for(let i=0;i<12;i++){

    ctx.fillStyle=
      i%2
      ?"#fff"
      :"#ff1493";

    ctx.fillRect(
      -55+i*10,
      -70,
      10,
      140
    );

  }

  ctx.restore();


  for(let i=0;i<8;i++){

    const index=
      Math.floor(
        i*TRACK_POINTS/8
      );

    const q=track[index];

    ctx.fillStyle="#00eaff55";

    ctx.shadowColor="#00eaff";

    ctx.shadowBlur=20;

    ctx.beginPath();

    ctx.arc(
      q.x,
      q.y,
      20,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* =========================================================
   AUTO
========================================================= */

function drawCar(car,cam){

  const x=
    VW/2+
    car.x-cam.x;

  const y=
    VH/2+
    car.y-cam.y;


  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    car.angle
  );


  ctx.fillStyle="#0009";

  ctx.beginPath();

  ctx.ellipse(
    0,
    14,
    28,
    15,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.shadowColor=
    car.color;

  ctx.shadowBlur=25;

  ctx.fillStyle=
    car.color;

  ctx.beginPath();

  ctx.roundRect(
    -28,
    -16,
    56,
    32,
    10
  );

  ctx.fill();


  ctx.shadowBlur=0;

  ctx.fillStyle="#070714";

  ctx.beginPath();

  ctx.roundRect(
    -8,
    -12,
    25,
    24,
    7
  );

  ctx.fill();


  ctx.fillStyle="#fff";

  ctx.fillRect(
    20,
    -10,
    7,
    7
  );

  ctx.fillRect(
    20,
    3,
    7,
    7
  );


  if(car.speed>6){

    ctx.fillStyle="#00eaff";

    ctx.shadowColor="#00eaff";

    ctx.shadowBlur=25;

    ctx.beginPath();

    ctx.moveTo(
      -25,
      -8
    );

    ctx.lineTo(
      -65,
      0
    );

    ctx.lineTo(
      -25,
      8
    );

    ctx.fill();

  }


  ctx.restore();


  ctx.textAlign="center";

  ctx.font=
    "bold 13px Arial";

  ctx.fillStyle="#fff";

  ctx.shadowColor=
    car.color;

  ctx.shadowBlur=10;

  ctx.fillText(
    car.name,
    x,
    y-30
  );

  ctx.shadowBlur=0;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const cam=
    getCamera();

  drawBackground(cam);

  drawTrack(cam);


  Object.values(players)
    .forEach(car=>{

      drawCar(
        car,
        cam
      );

    });


  updateHUD();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  const me=
    players[myId];

  if(!me)
    return;


  document.getElementById("lap")
    .textContent=
      `${Math.min(
        me.lap+1,
        LAPS
      )}/${LAPS}`;


  document.getElementById("speed")
    .textContent=
      Math.round(
        Math.abs(me.speed)*15
      );


  const ranking=
    Object.values(players)
      .slice()
      .sort((a,b)=>{

        const A=
          a.lap*100000+
          a.progress*100000;

        const B=
          b.lap*100000+
          b.progress*100000;

        return B-A;

      });


  const position=
    ranking.findIndex(
      p=>p.id===me.id
    )+1;


  document.getElementById("position")
    .textContent=
      position+"°";


  document.getElementById("online")
    .textContent=
      Object.keys(players).length;


  if(me.finished){

    finish(position);

  }

}


/* =========================================================
   FINAL
========================================================= */

function finish(position){

  if(!gameStarted)
    return;

  gameStarted=false;

  document.getElementById("finish")
    .style.display="flex";

  document.getElementById("finalRank")
    .textContent=
      position+"°";


  document.getElementById("finalText")
    .textContent=
      position===1
      ? "¡GANASTE! 🏆⚡"
      : "¡BUENA CARRERA! 🏎️";

}

</script>
