<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Isla de los 4</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #071b2b;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   INTRO
========================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;

    background:
        radial-gradient(circle at 50% 25%, #49d7ee, transparent 30%),
        linear-gradient(#075779, #031827);
}

#intro h1 {
    font-size: clamp(45px, 12vw, 100px);
    letter-spacing: 6px;
    text-shadow: 0 8px 30px #000;
    animation: aparecer 1.5s ease;
}

#intro p {
    margin-top: 15px;
    font-size: clamp(15px, 4vw, 22px);
    color: #d9f9ff;
}

.start {
    margin-top: 40px;
    padding: 17px 40px;
    border: 2px solid white;
    border-radius: 50px;
    background: rgba(255,255,255,.15);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    backdrop-filter: blur(10px);
}

.start:active {
    transform: scale(.95);
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    z-index: 10;
    top: 10px;
    left: 10px;
    right: 10px;

    display: none;
    justify-content: space-between;
    gap: 10px;

    pointer-events: none;
}

.panel {
    padding: 10px 14px;
    border-radius: 15px;
    background: rgba(0,20,35,.75);
    border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(8px);
}
