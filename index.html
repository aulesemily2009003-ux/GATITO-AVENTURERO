<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌸 Pinky Race 🌸</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffd6ed,#dfd0ff,#c9efff);
}

/* ===== MENU ===== */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffc9e4,#d8c5ff,#c5edff);
}

.menuBox{
    width:min(900px,94%);
    padding:35px;
    text-align:center;
    border-radius:35px;
    background:rgba(255,255,255,.92);
    border:4px solid #ff9dcc;
    box-shadow:0 15px 50px rgba(150,80,150,.3);
}

h1{
    font-size:clamp(40px,6vw,70px);
    color:#f05b9a;
    text-shadow:3px 3px white,0 0 15px #ff9dcc;
    margin-bottom:10px;
}

.subtitle{
    color:#9673b3;
    font-size:19px;
    margin-bottom:25px;
}

.playersInfo{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:25px 0;
}

.playerCard{
    padding:17px 8px;
    border-radius:22px;
    background:white;
    border:3px solid #ffd0e5;
    box-shadow:0 5px 15px rgba(150,100,160,.15);
}

.playerCard strong{
    display:block;
    margin-bottom:8px;
}

.p1{color:#ef5b91;}
.p2{color:#62b9e7;}
.p3{color:#e4ad43;}
.p4{color:#6cbd91;}

.keys{
    font-size:13px;
    color:#8d7899;
    font-weight:bold;
}

button{
    border:0;
    padding:17px 40px;
    border-radius:25px;
    background:linear-gradient(135deg,#ff80b8,#ad88ff);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 7px 0 #d06ca3,0 10px 25px #c888b5;
}

button:hover{
    transform:scale(1.05);
}

/* ===== JUEGO ===== */

#game{
    display:none;
    position:relative;
    width:100vw;
    height:100vh;
    background:#bdeaff;
}

/* ===== HUD ===== */

#hud{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    width:min(1000px,95%);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.hudPlayer{
    padding:8px 10px;
    border-radius:18px;
    background:rgba(255,255,255,.94);
    border:2px solid #ffc1dd;
    box-shadow:0 4px 15px rgba(100,70,130,.2);
    font-size:13px;
}

.bar{
    height:8px;
    background:#efdce7;
    border-radius:20px;
    overflow:hidden;
    margin-top:5px;
}

.life{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#ff72aa,#ffb8d5);
}

/* ===== CARRETERA ===== */

#road{
    position:absolute;
    width:min(900px,100vw);
    height:100vh;
    left:50%;
    transform:translateX(-50%);
    overflow:hidden;

    background:
    linear-gradient(
        90deg,
        #8ed39c 0%,
        #8ed39c 7%,
        #f1b6d0 7%,
        #f1b6d0 9%,
        #686974 9%,
        #686974 91%,
        #f1b6d0 91%,
        #f1b6d0 93%,
        #8ed39c 93%,
        #8ed39c 100%
    );

    box-shadow:inset 0 0 30px rgba(50,50,70,.25);
}

.roadEdge{
    position:absolute;
    width:8px;
    height:100%;
    top:0;
    background:white;
    z-index:2;
}

.edgeLeft{left:65px;}
.edgeRight{right:65px;}

.lane{
    position:absolute;
    top:-120px;
    width:9px;
    height:100px;
    border-radius:20px;
    background:#fff;
    box-shadow:0 0 8px white;
}

.lane1{left:25%;}
.lane2{left:50%;}
.lane3{left:75%;}

/* ===== DECORACIÓN ===== */

.scenery{
    position:absolute;
    z-index:3;
    pointer-events:none;
    font-size:45px;
}

/* ===== CARROS ===== */

.car{
    position:absolute;
    width:52px;
    height:86px;
    border-radius:18px 18px 12px 12px;
    z-index:10;
    border:3px solid white;

    box-shadow:
    0 7px 10px rgba(60,40,80,.35),
    0 0 15px rgba(255,255,255,.4);

    transition:transform .04s linear;
}

.car:before{
    content:"";
    position:absolute;
    width:31px;
    height:39px;
    left:8px;
    top:17px;
    border-radius:12px;
    background:linear-gradient(135deg,#ecfbff,#b6d9ed);
    border:2px solid white;
}

.car:after{
    content:"●  ●";
    position:absolute;
    bottom:3px;
    left:8px;
    color:#ff527c;
    font-size:10px;
    letter-spacing:3px;
}

.headlight{
    position:absolute;
    top:5px;
    left:7px;
    right:7px;
    display:flex;
    justify-content:space-between;
}

.headlight span{
    width:11px;
    height:6px;
    border-radius:10px;
    background:#fffde0;
    box-shadow:0 0 10px white;
}

.red{
    background:linear-gradient(135deg,#ff9fc5,#ff5b9b);
}

.blue{
    background:linear-gradient(135deg,#a9e8ff,#70baf2);
}

.yellow{
    background:linear-gradient(135deg,#fff3a1,#ffd365);
}

.green{
    background:linear-gradient(135deg,#b8f4ca,#72dca0);
}

.label{
    position:absolute;
    top:-23px;
    width:100%;
    text-align:center;
    color:white;
    font-size:12px;
    font-weight:bold;
    text-shadow:0 2px 4px #66516e;
}

/* ===== META ===== */

#finish{
    position:absolute;
    top:-200px;
    left:0;
    width:100%;
    height:120px;
    z-index:4;

    background:
    repeating-conic-gradient(
        #fff 0 25%,
        #c985c7 0 50%
    ) 0 0/60px 60px;

    border-top:7px solid white;
    border-bottom:7px solid white;
}

/* ===== VELOCIDAD ===== */

#speed{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;

    background:rgba(255,255,255,.94);
    border:2px solid #ffb7d8;
    padding:9px 20px;
    border-radius:25px;
    color:#8d5b88;
    font-weight:bold;
}

/* ===== FINAL ===== */

#finishScreen{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(255,204,231,.84);
}

.finishBox{
    text-align:center;
    padding:45px;
    border-radius:35px;
    background:white;
    border:4px solid #ff9fce;
    box-shadow:0 15px 50px rgba(170,90,160,.35);
}

#winner{
    font-size:35px;
    margin:20px;
    color:#db70ad;
}

/* ===== RESPONSIVE ===== */

@media(max-width:700px){

    .playersInfo{
        grid-template-columns:repeat(2,1fr);
    }

    #hud{
        grid-template-columns:repeat(2,1fr);
    }

    .menuBox{
        padding:22px;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

<div class="menuBox">

<h1>🌸 PINKY RACE 🌸</h1>

<div class="subtitle">
💕 Carrera divertida para 4 jugadores 💕
</div>

<div class="playersInfo">

<div class="playerCard">
<strong class="p1">🌷 JUGADOR 1</strong>
<div class="keys">W A S D</div>
</div>

<div class="playerCard">
<strong class="p2">🩵 JUGADOR 2</strong>
<div class="keys">FLECHAS</div>
</div>

<div class="playerCard">
<strong class="p3">🌼 JUGADOR 3</strong>
<div class="keys">I J K L</div>
</div>

<div class="playerCard">
<strong class="p4">🍀 JUGADOR 4</strong>
<div class="keys">8 4 5 6</div>
</div>

</div>

<p style="margin-bottom:20px;color:#96759e;">
✨ ¡Corre, esquiva y llega primero a la meta! ✨
</p>

<button id="startButton">
🎀 COMENZAR CARRERA 🎀
</button>

</div>
</div>


<!-- ================= JUEGO ================= -->

<div id="game">

<div id="hud">

<div class="hudPlayer">
<span class="p1">🌷 J1 🚗</span>
<div class="bar">
<div id="life1" class="life"></div>
</div>
</div>

<div class="hudPlayer">
<span class="p2">🩵 J2 🚙</span>
<div class="bar">
<div id="life2" class="life"></div>
</div>
</div>

<div class="hudPlayer">
<span class="p3">🌼 J3 🏎️</span>
<div class="bar">
<div id="life3" class="life"></div>
</div>
</div>

<div class="hudPlayer">
<span class="p4">🍀 J4 🚘</span>
<div class="bar">
<div id="life4" class="life"></div>
</div>
</div>

</div>


<div id="road">

<div class="roadEdge edgeLeft"></div>
<div class="roadEdge edgeRight"></div>

<div class="lane lane1"></div>
<div class="lane lane2"></div>
<div class="lane lane3"></div>

<div id="finish"></div>


<!-- DECORACIÓN -->

<div class="scenery" style="left:2%;top:100px;">🌸</div>
<div class="scenery" style="right:2%;top:300px;">🌳</div>
<div class="scenery" style="left:2%;top:500px;">🌷</div>
<div class="scenery" style="right:2%;top:700px;">🌸</div>
<div class="scenery" style="left:2%;top:900px;">🌳</div>
<div class="scenery" style="right:2%;top:1100px;">🌷</div>


<!-- CARRO 1 -->

<div id="car1" class="car red">
<div class="label">J1</div>
<div class="headlight">
<span></span>
<span></span>
</div>
</div>


<!-- CARRO 2 -->

<div id="car2" class="car blue">
<div class="label">J2</div>
<div class="headlight">
<span></span>
<span></span>
</div>
</div>


<!-- CARRO 3 -->

<div id="car3" class="car yellow">
<div class="label">J3</div>
<div class="headlight">
<span></span>
<span></span>
</div>
</div>


<!-- CARRO 4 -->

<div id="car4" class="car green">
<div class="label">J4</div>
<div class="headlight">
<span></span>
<span></span>
</div>
</div>

</div>


<div id="speed">
💨 Velocidad:
<span id="speedText">8</span>
km/h
</div>

</div>


<!-- ================= FINAL ================= -->

<div id="finishScreen">

<div class="finishBox">

<h1>🎀 ¡CARRERA TERMINADA! 🎀</h1>

<div id="winner"></div>

<button onclick="location.reload()">
🌸 JUGAR DE NUEVO 🌸
</button>

</div>

</div>


<script>

const game=document.getElementById("game");
const menu=document.getElementById("menu");
const road=document.getElementById("road");

const cars=[
document.getElementById("car1"),
document.getElementById("car2"),
document.getElementById("car3"),
document.getElementById("car4")
];

const lifeBars=[
document.getElementById("life1"),
document.getElementById("life2"),
document.getElementById("life3"),
document.getElementById("life4")
];

const players=[

{
x:100,
y:650,
speed:5,
life:100,
controls:{
up:"w",
down:"s",
left:"a",
right:"d"
}
},

{
x:300,
y:650,
speed:5,
life:100,
controls:{
up:"ArrowUp",
down:"ArrowDown",
left:"ArrowLeft",
right:"ArrowRight"
}
},

{
x:500,
y:650,
speed:5,
life:100,
controls:{
up:"i",
down:"k",
left:"j",
right:"l"
}
},

{
x:700,
y:650,
speed:5,
life:100,
controls:{
up:"8",
down:"5",
left:"4",
right:"6"
}
}

];

let keys={};
let running=false;
let audioContext=null;
let audioStarted=false;


/* CONTROLES */

window.addEventListener("keydown",e=>{

keys[e.key]=true;

if([
"ArrowUp",
"ArrowDown",
"ArrowLeft",
"ArrowRight"
].includes(e.key)){
e.preventDefault();
}

});

window.addEventListener("keyup",e=>{
keys[e.key]=false;
});


/* SONIDO */

function startAudio(){

if(audioStarted)return;

audioStarted=true;

audioContext=
new(window.AudioContext||window.webkitAudioContext)();

for(let i=0;i<4;i++){

const osc=audioContext.createOscillator();
const gain=audioContext.createGain();

osc.type="sawtooth";
osc.frequency.value=70+i*8;

gain.gain.value=.018;

osc.connect(gain);
gain.connect(audioContext.destination);

osc.start();

}

}


/* CHOQUE */

function crashSound(){

if(!audioContext)return;

const osc=audioContext.createOscillator();
const gain=audioContext.createGain();

osc.type="square";
osc.frequency.value=100;

gain.gain.setValueAtTime(
.15,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
audioContext.currentTime+.2
);

osc.connect(gain);
gain.connect(audioContext.destination);

osc.start();

osc.stop(
audioContext.currentTime+.2
);

}


/* INICIAR */

document.getElementById("startButton").onclick=()=>{

startAudio();

menu.style.display="none";
game.style.display="block";

running=true;

requestAnimationFrame(gameLoop);

};


/* MOVIMIENTO */

function movePlayer(player,index){

const c=player.controls;

if(keys[c.up])player.y-=player.speed;
if(keys[c.down])player.y+=player.speed;
if(keys[c.left])player.x-=player.speed;
if(keys[c.right])player.x+=player.speed;

player.x=Math.max(
75,
Math.min(
road.clientWidth-125,
player.x
)
);

player.y=Math.max(
100,
Math.min(
window.innerHeight-110,
player.y
)
);

cars[index].style.left=player.x+"px";
cars[index].style.top=player.y+"px";

let tilt=0;

if(keys[c.left])tilt=-7;
if(keys[c.right])tilt=7;

cars[index].style.transform=
`rotate(${tilt}deg)`;

}


/* AUTOPISTA */

function moveRoad(){

document.querySelectorAll(".lane")
.forEach(lane=>{

let y=parseFloat(
lane.dataset.y||-120
);

y+=8;

if(y>window.innerHeight+100)
y=-120;

lane.dataset.y=y;
lane.style.top=y+"px";

});


document.querySelectorAll(".scenery")
.forEach(item=>{

let y=parseFloat(
item.dataset.y||item.offsetTop
);

y+=7;

if(y>window.innerHeight+100)
y=-100;

item.dataset.y=y;
item.style.top=y+"px";

});


const finish=
document.getElementById("finish");

let y=parseFloat(
finish.dataset.y||-200
);

y+=8;

if(y>window.innerHeight+100)
y=-300;

finish.dataset.y=y;
finish.style.top=y+"px";

}


/* COLISIONES */

function collision(a,b){

return(
a.x<b.x+52 &&
a.x+52>b.x &&
a.y<b.y+86 &&
a.y+86>b.y
);

}

function checkCollisions(){

for(let i=0;i<players.length;i++){

for(let j=i+1;j<players.length;j++){

if(collision(players[i],players[j])){

players[i].life-=.6;
players[j].life-=.6;

lifeBars[i].style.width=
Math.max(0,players[i].life)+"%";

lifeBars[j].style.width=
Math.max(0,players[j].life)+"%";

crashSound();

players[i].x-=10;
players[j].x+=10;

}

}

}

}


/* VELOCIDAD */

function updateSpeed(){

const speed=
8+Math.floor(
Math.sin(Date.now()/600)*3
);

document.getElementById("speedText")
.textContent=speed;

}


/* META */

function checkFinish(){

const finish=
document.getElementById("finish");

const finishY=
parseFloat(finish.style.top);

for(let i=0;i<players.length;i++){

if(
players[i].y<finishY+120 &&
players[i].y+86>finishY
){

winner(i);
return;

}

}

}


/* GANADOR */

function winner(index){

running=false;

document.getElementById("finishScreen")
.style.display="flex";

document.getElementById("winner")
.textContent=
"🌸 ¡GANÓ EL JUGADOR "+
(index+1)+
"! 🌸";

}


/* GAME LOOP */

function gameLoop(){

if(!running)return;

for(let i=0;i<players.length;i++){

movePlayer(
players[i],
i
);

}

moveRoad();
checkCollisions();
updateSpeed();
checkFinish();

requestAnimationFrame(gameLoop);

}

</script>

</body>
</html>
