<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Pinky Race 🌸</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    font-family:"Trebuchet MS",Arial,sans-serif;
    background:
        linear-gradient(135deg,#ffd6ed,#e8d8ff,#cceeff);
    color:#5b416b;
}

/* =========================
   MENÚ
========================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 20% 20%,#fff 0 5%,transparent 6%),
        radial-gradient(circle at 80% 30%,#fff 0 4%,transparent 5%),
        linear-gradient(135deg,#ffcce6,#d9c7ff,#c5edff);
}

.menuBox{
    width:min(900px,94%);
    padding:35px;
    text-align:center;
    border-radius:35px;
    background:rgba(255,255,255,.88);
    border:4px solid #ff9fce;
    box-shadow:
        0 15px 50px rgba(151,92,160,.3),
        inset 0 0 30px rgba(255,170,220,.25);
}

h1{
    font-size:clamp(38px,6vw,70px);
    color:#f15b9a;
    text-shadow:
        3px 3px 0 #fff,
        0 0 15px #ff9dcc;
    margin-bottom:8px;
}

.subtitle{
    color:#9874b6;
    font-size:19px;
    margin-bottom:25px;
}

.playersInfo{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    margin:25px 0;
}

.playerCard{
    padding:17px 10px;
    border-radius:22px;
    background:#fff;
    border:3px solid #ffd1e7;
    box-shadow:0 5px 15px rgba(160,100,160,.15);
}

.playerCard strong{
    display:block;
    margin-bottom:9px;
}

.p1{color:#f05b91;}
.p2{color:#64b9e8;}
.p3{color:#e5ad42;}
.p4{color:#71bd91;}

.keys{
    color:#8f789c;
    font-size:13px;
    font-weight:bold;
}

button{
    border:0;
    padding:17px 40px;
    border-radius:25px;
    background:linear-gradient(135deg,#ff83ba,#b88cff);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
        0 7px 0 #d16da2,
        0 10px 25px rgba(193,92,164,.35);
    transition:.2s;
}

button:hover{
    transform:translateY(-3px) scale(1.04);
}

button:active{
    transform:translateY(4px);
    box-shadow:0 3px 0 #d16da2;
}

/* =========================
   JUEGO
========================= */

#game{
    display:none;
    width:100vw;
    height:100vh;
    position:relative;
    background:#bce8ff;
}

/* cielo */

#game:before{
    content:"☁️       ☁️              ☁️";
    position:absolute;
    top:15px;
    left:0;
    width:100%;
    text-align:center;
    font-size:35px;
    opacity:.8;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    width:min(1000px,95%);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.hudPlayer{
    padding:8px 10px;
    border-radius:18px;
    background:rgba(255,255,255,.92);
    border:2px solid #ffc2df;
    box-shadow:0 4px 15px rgba(120,90,150,.2);
    font-size:13px;
}

.bar{
    height:8px;
    background:#f0dce8;
    border-radius:20px;
    overflow:hidden;
    margin-top:5px;
}

.life{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#ff78ad,#ffb7d5);
    border-radius:20px;
}

/* =========================
   AUTOPISTA
========================= */

#road{
    position:absolute;
    width:min(900px,100vw);
    height:100vh;
    left:50%;
    transform:translateX(-50%);
    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            #8ed29c 0%,
            #8ed29c 7%,
            #f3b5d0 7%,
            #f3b5d0 9%,
            #6d6d78 9%,
            #6d6d78 91%,
            #f3b5d0 91%,
            #f3b5d0 93%,
            #8ed29c 93%,
            #8ed29c 100%
        );

    box-shadow:
        inset 0 0 30px rgba(80,70,100,.25);
}

/* bordes */

.roadEdge{
    position:absolute;
    width:8px;
    height:100%;
    top:0;
    background:#fff;
    z-index:2;
    box-shadow:0 0 8px rgba(255,255,255,.8);
}

.edgeLeft{left:65px;}
.edgeRight{right:65px;}

/* líneas */

.lane{
    position:absolute;
    top:-100px;
    width:9px;
    height:100px;
    border-radius:20px;
    background:#fff5fc;
    box-shadow:0 0 8px rgba(255,255,255,.7);
}

.lane1{left:25%;}
.lane2{left:50%;}
.lane3{left:75%;}

/* =========================
   DECORACIÓN
========================= */

.scenery{
    position:absolute;
    z-index:3;
    pointer-events:none;
    font-size:45px;
    filter:drop-shadow(0 4px 3px rgba(60,70,70,.2));
}

/* =========================
   CARROS
========================= */

.car{
    position:absolute;
    width:52px;
    height:86px;
    border-radius:18px 18px 12px 12px;
    z-index:10;

    border:3px solid rgba(255,255,255,.8);

    box-shadow:
        0 7px 10px rgba(60,40,80,.35),
        0 0 15px rgba(255,255,255,.4);

    transition:transform .04s linear;
}

/* ventana */

.car:before{
    content:"";
    position:absolute;
    width:31px;
    height:39px;
    left:8px;
    top:17px;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        #eafaff,
        #b6d9ef
    );
    border:2px solid rgba(255,255,255,.9);
}

/* luces traseras */

.car:after{
    content:"●  ●";
    position:absolute;
    bottom:3px;
    left:8px;
    color:#ff537c;
    font-size:10px;
    letter-spacing:3px;
}

/* faros */

.headlight{
    position:absolute;
    top:5px;
    left:7px;
    right:7px;
    display:flex;
    justify-content:space-between;
}

.headlight span{
    width:11px;
    height:6px;
    border-radius:10px;
    background:#fffde0;
    box-shadow:0 0 10px #fff;
}

/* colores */

.red{
    background:linear-gradient(135deg,#ff9fc5,#ff5d9b);
}

.blue{
    background:linear-gradient(135deg,#a9e8ff,#70baf2);
}

.yellow{
    background:linear-gradient(135deg,#fff3a1,#ffd365);
}

.green{
    background:linear-gradient(135deg,#b8f4ca,#72dca0);
}

.label{
    position:absolute;
    top:-22px;
    width:100%;
    text-align:center;
    font-size:12px;
    font-weight:bold;
    color:#fff;
    text-shadow:0 2px 4px #66516e;
}

/* =========================
   META
========================= */

#finish{
    position:absolute;
    top:-200px;
    left:0;
    width:100%;
    height:120px;
    z-index:4;

    background:
        repeating-conic-gradient(
            #fff 0 25%,
            #c986c7 0 50%
        ) 0 0 / 60px 60px;

    border-top:7px solid white;
    border-bottom:7px solid white;

    box-shadow:0 0 20px rgba(255,255,255,.8);
}

/* =========================
   VELOCIDAD
========================= */

#speed{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;

    background:rgba(255,255,255,.92);
    border:2px solid #ffb7d8;
    padding:9px 20px;
    border-radius:25px;
    color:#8d5b88;
    font-weight:bold;
}

/* =========================
   FINAL
========================= */

#finishScreen{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(255,204,231,.82);
}

.finishBox{
    text-align:center;
    padding:45px;
    border-radius:35px;
    background:white;
    border:4px solid #ff9fce;
    box-shadow:
        0 15px 50px rgba(170,90,160,.35);
}

.finishBox h1{
    font-size:45px;
}

#winner{
    font-size:35px;
    margin:20px;
    color:#db70ad;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .playersInfo{
        grid-template-columns:repeat(2,1fr);
    }

    #hud{
        grid-template-columns:repeat(2,1fr);
    }

    .menuBox{
        padding:22px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENÚ
========================= -->

<div id="menu">

    <div class="menuBox">

        <h1>🌸 PINKY RACE 🌸</h1>

        <div class="subtitle">
            💕 Una carrera súper cute para 4 jugadores 💕
        </div>

        <div class="playersInfo">

            <div class="playerCard">
                <strong class="p1">🌷 JUGADOR 1</strong>
                <div class="keys">W A S D</div>
            </div>

            <div class="playerCard">
                <strong class="p2">🩵 JUGADOR 2</strong>
                <div class="keys">FLECHAS</div>
            </div>

            <div class="playerCard">
                <strong class="p3">🌼 JUGADOR 3</strong>
                <div class="keys">I J K L</div>
            </div>

            <div class="playerCard">
                <strong class="p4">🍀 JUGADOR 4</strong>
                <div class="keys">8 4 5 6</div>
            </div>

        </div>

        <p style="margin-bottom:20px;color:#96759e;">
            ✨ ¡Muévete, evita a los demás carros y llega a la meta! ✨
        </p>

        <button id="startButton">
            🎀 COMENZAR CARRERA 🎀
        </button>

    </div>

</div>


<!-- =========================
     JUEGO
========================= -->

<div id="game">

    <div id="hud">

        <div class="hudPlayer">
            <span class="p1">🌷 J1 🚗</span>
            <div class="bar">
                <div id="life1" class="life"></div>
            </div>
        </div>

        <div class="hudPlayer">
            <span class="p2">🩵 J2 🚙</span>
            <div class="bar">
                <div id="life2" class="life"></div>
            </div>
        </div>

        <div class="hudPlayer">
            <span class="p3">🌼 J3 🏎️</span>
            <div class="bar">
                <div id="life3" class="life"></div>
            </div>
        </div>

        <div class="hudPlayer">
            <span class="p4">🍀 J4 🚘</span>
            <div class="bar">
                <div id="life4" class="life"></div>
            </div>
        </div>

    </div>


    <div id="road">

        <div class="roadEdge edgeLeft"></div>
        <div class="roadEdge edgeRight"></div>

        <div class="lane lane1"></div>
        <div class="lane lane2"></div>
        <div class="lane lane3"></div>

        <div id="finish"></div>


        <!-- DECORACIÓN -->

        <div class="scenery" style="left:2%;top:120px;">🌸</div>
        <div class="scenery" style="right:2%;top:300px;">🌳</div>
        <div class="scenery" style="left:2%;top:520px;">🌷</div>
        <div class="scenery" style="right:2%;top:720px;">🌸</div>
        <div class="scenery" style="left:3%;top:900px;">🌳</div>
        <div class="scenery" style="right:3%;top:1100px;">🌷</div>


        <!-- CARRO 1 -->

        <div id="car1" class="car red">

            <div class="label">J1</div>

            <div class="headlight">
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- CARRO 2 -->

        <div id="car2" class="car blue">

            <div class="label">J2</div>

            <div class="headlight">
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- CARRO 3 -->

        <div id="car3" class="car yellow">

            <div class="label">J3</div>

            <div class="headlight">
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- CARRO 4 -->

        <div id="car4" class="car green">

            <div class="label">J4</div>

            <div class="headlight">
                <span></span>
                <span></span>
            </div>

        </div>

    </div>


    <div id="speed">
        💨 Velocidad:
        <span id="speedText">8</span>
        km/h
    </div>

</div>


<!-- =========================
     PANTALLA FINAL
========================= -->

<div id="finishScreen">

    <div class="finishBox">

        <h1>🎀 ¡CARRERA TERMINADA! 🎀</h1>

        <div id="winner"></div>

        <button onclick="location.reload()">
            🌸 JUGAR DE NUEVO 🌸
        </button>

    </div>

</div>


<script>

/* ==========================================
   VARIABLES
========================================== */

const game =
    document.getElementById("game");

const menu =
    document.getElementById("menu");

const road =
    document.getElementById("road");

const cars = [

    document.getElementById("car1"),

    document.getElementById("car2"),

    document.getElementById("car3"),

    document.getElementById("car4")

];

const lifeBars = [

    document.getElementById("life1"),

    document.getElementById("life2"),

    document.getElementById("life3"),

    document.getElementById("life4")

];


/* ==========================================
   JUGADORES
========================================== */

const players = [

    {
        x:100,
        y:650,
        speed:5,
        life:100,

        controls:{
            up:"w",
            down:"s",
            left:"a",
            right:"d"
        }
    },

    {
        x:300,
        y:650,
        speed:5,
        life:100,

        controls:{
            up:"ArrowUp",
            down:"ArrowDown",
            left:"ArrowLeft",
            right:"ArrowRight"
        }
    },

    {
        x:500,
        y:650,
        speed:5,
        life:100,

        controls:{
            up:"i",
            down:"k",
            left:"j",
            right:"l"
        }
    },

    {
        x:700,
        y:650,
        speed:5,
        life:100,

        controls:{
            up:"8",
            down:"5",
            left:"4",
            right:"6"
        }
    }

];


let keys = {};

let running = false;

let roadOffset = 0;

let audioContext = null;

let audioStarted = false;

let engineOscillators = [];


/* ==========================================
   TECLADO
========================================== */

window.addEventListener("keydown",function(e){

    keys[e.key] = true;

    if([
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight"
    ].includes(e.key)){

        e.preventDefault();

    }

});


window.addEventListener("keyup",function(e){

    keys[e.key] = false;

});


/* ==========================================
   SONIDO DEL MOTOR
========================================== */

function startAudio(){

    if(audioStarted)
        return;

    audioStarted = true;

    audioContext =
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    for(let i=0;i<4;i++){

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type = "sawtooth";

        osc.frequency.value =
            65 + i * 9;

        gain.gain.value = .018;

        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );

        osc.start();

        engineOscillators.push({
            osc,
            gain
        });

    }

}


/* ==========================================
   SONIDO DE CHOQUE
========================================== */

function crashSound(){

    if(!audioContext)
        return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "square";

    osc.frequency.value = 100;

    gain.gain.setValueAtTime(
        .15,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .2
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime + .2
    );

}


/* ==========================================
   INICIAR JUEGO
========================================== */

document.getElementById(
    "startButton"
).onclick = function(){

    startAudio();

    menu.style.display = "none";

    game.style.display = "block";

    running = true;

    requestAnimationFrame(gameLoop);

};


/* ==========================================
   MOVIMIENTO DE CARROS
========================================== */

function movePlayer(player,index){

    const c =
        player.controls;


    if(keys[c.up])
        player.y -= player.speed;

    if(keys[c.down])
        player.y += player.speed;

    if(keys[c.left])
        player.x -= player.speed;

    if(keys[c.right])
        player.x += player.speed;


    /* límites horizontales */

    player.x =
        Math.max(
            75,
            Math.min(
                road.clientWidth - 125,
                player.x
            )
        );


    /* límites verticales */

    player.y =
        Math.max(
            100,
            Math.min(
                window.innerHeight - 110,
                player.y
            )
        );


    cars[index].style.left =
        player.x + "px";

    cars[index].style.top =
        player.y + "px";


    /* inclinación */

    let tilt = 0;

    if(keys[c.left])
        tilt = -7;

    if(keys[c.right])
        tilt = 7;


    cars[index].style.transform =
        `rotate(${tilt}deg)`;

}


/* ==========================================
   AUTOPISTA EN MOVIMIENTO
========================================== */

function moveRoad(){

    roadOffset += 8;

    if(roadOffset > 200)
        roadOffset = 0;


    document.querySelectorAll(
        ".lane"
    ).forEach(function(lane){

        let y =
            parseFloat(
                lane.dataset.y || -100
            );

        y += 8;

        if(y > window.innerHeight + 100)
            y = -100;

        lane.dataset.y = y;

        lane.style.top =
            y + "px";

    });


    /* árboles y flores */

    document.querySelectorAll(
        ".scenery"
    ).forEach(function(item){

        let y =
            parseFloat(
                item.dataset.y ||
                item.offsetTop
            );

        y += 7;

        if(y >
            window.innerHeight + 100
        ){
            y = -100;
        }

        item.dataset.y = y;

        item.style.top =
            y + "px";

    });


    /* meta */

    const finish =
        document.getElementById(
            "finish"
        );

    let y =
        parseFloat(
            finish.dataset.y || -200
        );

    y += 8;

    if(y >
        window.innerHeight + 100
    ){
        y = -300;
    }

    finish.dataset.y = y;

    finish.style.top =
        y + "px";

}


/* ==========================================
   COLISIONES
========================================== */

function collision(a,b){

    return (

        a.x < b.x + 52 &&

        a.x + 52 > b.x &&

        a.y < b.y + 86 &&

        a.y + 86 > b.y

    );

}


function checkCollisions(){

    for(
        let i=0;
        i<players.length;
        i++
    ){

        for(
            let j=i+1;
            j<players.length;
            j++
        ){

            if(
                collision(
                    players[i],
                    players[j]
                )
            ){

                players[i].life -= .6;

                players[j].life -= .6;


                lifeBars[i].style.width =
                    Math.max(
                        0,
                        players[i].life
                    ) + "%";


                lifeBars[j].style.width =
                    Math.max(
                        0,
                        players[j].life
                    ) + "%";


                crashSound();


                players[i].x -= 10;

                players[j].x += 10;

            }

        }

    }

}


/* ==========================================
   VELOCIDAD
========================================== */

function updateSpeed(){

    const speed =
        8 +
        Math.floor(
            Math.sin(
                Date.now()/600
            ) * 3
        );

    document.getElementById(
        "speedText"
    ).textContent = speed;

}


/* ==========================================
   META
========================================== */

function checkFinish(){

    const finish =
        document.getElementById(
            "finish"
        );

    const finishY =
        parseFloat(
            finish.style.top
        );


    for(
        let i=0;
        i<players.length;
        i++
    ){

        if(

            players[i].y <
            finishY + 120 &&

            players[i].y + 86 >
            finishY

        ){

            winner(i);

            return true;

        }

    }

    return false;

}


/* ==========================================
   GANADOR
========================================== */

function winner(index){

    running = false;

    document.getElementById(
        "finishScreen"
    ).style.display = "flex";


    document.getElementById(
        "winner"
    ).textContent =

        "🌸 ¡GANÓ EL JUGADOR " +
        (index + 1) +
        "! 🌸";

}


/* ==========================================
   GAME LOOP
========================================== */

function gameLoop(){

    if(!running)
        return;


    for(
        let i=0;
        i<players.length;
        i++
    ){

        movePlayer(
            players[i],
            i
        );

    }


    moveRoad();

    checkCollisions();

    updateSpeed();

    checkFinish();


    requestAnimationFrame(
        gameLoop
    );

}

</script>

</body>
</html>
